# Ide u tvoj fork zvanicnog repoa: .github/workflows/moj-build.yml
# Pokrece se samo rucno (Actions > Moj Aseprite build > Run workflow).
# Koristi zvanicnu build.sh skriptu, isto kao Asepriteov build-auto.yml.

name: Moj Aseprite build

on:
  workflow_dispatch:
    inputs:
      verzija:
        description: "Tag stabilne verzije sa aseprite/aseprite Releases (npr. v1.3.x) ili main"
        required: true
        default: "main"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          repository: aseprite/aseprite
          ref: ${{ inputs.verzija }}
          submodules: recursive

      - uses: aseprite/get-ninja@main

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Kompajliranje (zvanicna skripta, release mod)
        shell: bash
        run: bash build.sh --auto --norun

      - name: Dodavanje OpenSSL DLL fajlova
        shell: bash
        run: |
          for name in libcrypto-3-x64.dll libssl-3-x64.dll; do
            src=$(find "/c/Program Files/OpenSSL" "/c/Program Files/OpenSSL-Win64" -maxdepth 2 -iname "$name" 2>/dev/null | head -n 1)
            if [ -n "$src" ]; then cp "$src" build/bin/ && echo "Kopiran $src"; else echo "Nije nadjen $name"; fi
          done

      - name: Otpremanje gotovog programa
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows
          path: build/bin/
          retention-days: 1
