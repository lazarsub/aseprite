# Ide u tvoj fork zvanicnog repoa: .github/workflows/moj-build.yml
# Pokrece se samo rucno (Actions > Moj Aseprite build > Run workflow).
# Koristi zvanicnu build.sh skriptu, isto kao Asepriteov build-auto.yml.

name: Moj Aseprite build

on:
  workflow_dispatch:
    inputs:
      verzija:
        description: "Tag stabilne verzije sa aseprite/aseprite Releases (npr. v1.3.x) ili main"
        required: true
        default: "main"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verzija }}
          submodules: recursive

      - uses: aseprite/get-ninja@main

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Kompajliranje (zvanicna skripta, release mod)
        shell: bash
        run: bash build.sh --auto --norun

      - name: Otpremanje gotovog programa
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows
          path: build/bin/
          retention-days: 1
